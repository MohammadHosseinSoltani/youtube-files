<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline PDF Merger</title>
    
    <script src="https://lib.arvancloud.ir/pdf-lib/1.9.0/pdf-lib.min.js"></script>

    <style>
        :root {
            --bg-main: #1e1e1e;
            --bg-panel: #252526;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --accent: #007acc;
            --accent-hover: #0098ff;
            --success: #238636;
            --success-hover: #2ea043;
            --border: #333333;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--bg-panel);
            width: 100%;
            max-width: 600px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            padding: 30px;
            border: 1px solid var(--border);
        }

        h1 {
            margin-top: 0;
            font-size: 22px;
            color: var(--accent);
            text-align: center;
            margin-bottom: 5px;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .drop-zone {
            border: 2px dashed #555;
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--accent);
            background-color: rgba(0, 122, 204, 0.1);
        }
        
        .drop-zone.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: #555 !important;
            background-color: rgba(0, 0, 0, 0.2) !important;
        }

        .drop-zone svg {
            width: 50px;
            height: 50px;
            fill: var(--accent);
            margin-bottom: 15px;
        }

        .drop-zone input[type="file"] {
            display: none;
        }

        .progress-container {
            display: none;
            margin-top: 20px;
        }

        .progress-bar-bg {
            background-color: #333;
            border-radius: 4px;
            height: 12px;
            width: 100%;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--accent);
            width: 0%;
            transition: width 0.2s ease;
        }

        .status-text {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .file-list {
            margin-top: 15px;
            margin-bottom: 15px;
            font-size: 12px;
            color: var(--text-muted);
            background: #1a1a1a;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            max-height: 120px;
            overflow-y: auto;
            display: none;
        }

        .file-list ul {
            margin: 0;
            padding-left: 20px;
        }

        .parts-container {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .download-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--success);
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s;
            cursor: pointer;
        }

        .download-btn:hover {
            background-color: var(--success-hover);
        }

        .size-badge {
            background: rgba(0,0,0,0.3);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔗 Offline PDF Merger</h1>
        <p class="subtitle">Select all split parts at once. They will be auto-sorted and merged.</p>

        <div class="drop-zone" id="drop-zone">
            <!-- Icon for merging files -->
            <svg viewBox="0 0 24 24">
                <path d="M16 11H8V13H16V11ZM16 15H8V17H16V15ZM19 3H5C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H19C20.1 21 21 20.1 21 19V5C21 3.9 20.1 3 19 3ZM19 19H5V5H19V19ZM16 7H8V9H16V7Z"/>
            </svg>
            <h3>Drag & Drop ALL split PDFs here</h3>
            <p style="color: var(--text-muted); font-size: 13px;">Or click to browse files</p>
            <!-- Note the "multiple" attribute allows selecting many files at once -->
            <input type="file" id="file-input" accept=".pdf" multiple>
        </div>

        <div class="progress-container" id="progress-container">
            <div class="status-text" id="status-text">Processing...</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
            
            <div class="file-list" id="file-list-container">
                <strong>Detected Order:</strong>
                <ul id="file-list"></ul>
            </div>
        </div>

        <div class="parts-container" id="parts-list"></div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const progressContainer = document.getElementById('progress-container');
        const progressFill = document.getElementById('progress-fill');
        const statusText = document.getElementById('status-text');
        const fileListContainer = document.getElementById('file-list-container');
        const fileList = document.getElementById('file-list');
        const partsList = document.getElementById('parts-list');

        let isProcessing = false;
        let objectURLs = []; 

        const yieldToUI = () => new Promise(r => setTimeout(r, 0));

        // Drag & Drop Setup
        dropZone.addEventListener('click', () => {
            if (!isProcessing) fileInput.click();
        });
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            if (!isProcessing) dropZone.classList.add('dragover');
        });
        
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (isProcessing) return;
            if (e.dataTransfer.files.length > 0) {
                handleFiles(Array.from(e.dataTransfer.files));
            }
        });
        
        fileInput.addEventListener('change', (e) => {
            if (isProcessing) return;
            if (e.target.files.length > 0) {
                handleFiles(Array.from(e.target.files));
            }
        });

        // Smart sorting function to extract numbers from filenames (e.g., "Doc_Part_2.pdf" -> 2)
        function extractFileNumber(filename) {
            // Find all numbers in the filename
            const matches = filename.match(/\d+/g);
            // If numbers are found, return the last one (usually the part number), otherwise a high number to push to end
            return matches ? parseInt(matches[matches.length - 1], 10) : 999999;
        }

        async function handleFiles(files) {
            // Filter only PDFs
            const pdfFiles = files.filter(f => f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf'));
            
            if (pdfFiles.length === 0) {
                alert('Please select at least one valid PDF file.');
                return;
            }

            if (typeof PDFLib === 'undefined') {
                alert('PDF library is not loaded. Please check your internet connection to the CDN.');
                return;
            }

            isProcessing = true;
            dropZone.classList.add('disabled');
            
            // Clean memory
            objectURLs.forEach(url => URL.revokeObjectURL(url));
            objectURLs = [];

            // Sort files logically by the numbers found in their filenames
            pdfFiles.sort((a, b) => extractFileNumber(a.name) - extractFileNumber(b.name));

            // UI Reset
            partsList.innerHTML = '';
            fileList.innerHTML = '';
            pdfFiles.forEach(f => {
                const li = document.createElement('li');
                li.textContent = f.name;
                fileList.appendChild(li);
            });
            fileListContainer.style.display = 'block';
            progressContainer.style.display = 'block';
            progressFill.style.width = '0%';
            
            await yieldToUI();

            try {
                // Create a blank PDF Document to hold everything
                statusText.innerText = 'Initializing merged document...';
                const mergedPdf = await PDFLib.PDFDocument.create();
                
                let processedCount = 0;
                
                // Loop through all sorted files and append them
                for (const file of pdfFiles) {
                    statusText.innerText = `Merging: ${file.name}...`;
                    await yieldToUI();

                    const arrayBuffer = await file.arrayBuffer();
                    const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
                    const copiedPages = await mergedPdf.copyPages(pdfDoc, pdfDoc.getPageIndices());
                    
                    for (const page of copiedPages) {
                        mergedPdf.addPage(page);
                    }

                    processedCount++;
                    const pct = Math.round((processedCount / pdfFiles.length) * 100);
                    progressFill.style.width = pct + '%';
                    await yieldToUI();
                }

                statusText.innerText = 'Generating final merged PDF... (This may take a moment)';
                await yieldToUI();

                const mergedBytes = await mergedPdf.save();
                
                statusText.innerText = `✅ Merging complete! Merged ${pdfFiles.length} file(s) into one.`;

                // Derive base name from the first file, stripping "_Part_1" if it exists
                let baseName = pdfFiles[0].name.replace(/\.[^/.]+$/, ""); 
                baseName = baseName.replace(/[_-]?part[_-]?\d+/i, "");

                addDownloadButton(mergedBytes, baseName || "Merged_Document");

            } catch (error) {
                console.error("PDF Processing Error:", error);
                if (error.message && error.message.toLowerCase().includes('encrypted')) {
                    statusText.innerText = '❌ Error: One or more PDFs are encrypted.';
                    alert('Cannot merge encrypted PDFs. Please unlock them first.');
                } else {
                    statusText.innerText = '❌ An error occurred. See console for details.';
                    alert('An error occurred during merging. Ensure the files are not corrupted.');
                }
            } finally {
                isProcessing = false;
                dropZone.classList.remove('disabled');
                fileInput.value = ''; 
            }
        }

        function addDownloadButton(bytes, baseName) {
            const blob = new Blob([bytes], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            objectURLs.push(url); 
            
            const sizeMB = (bytes.byteLength / (1024 * 1024)).toFixed(2);
            
            const btn = document.createElement('a');
            btn.href = url;
            btn.download = `${baseName}_Merged.pdf`;
            btn.className = 'download-btn';
            btn.innerHTML = `⬇️ Save Merged PDF <span class="size-badge">${sizeMB} MB</span>`;
            
            partsList.appendChild(btn);
        }
    </script>
</body>
</html>
